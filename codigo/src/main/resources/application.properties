spring.application.name=tienda

# PostgreSQL connection (the container from compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/tienda
spring.datasource.username=tienda
spring.datasource.password=tienda

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Validation errors and unhandled exceptions as RFC 9457 ProblemDetail
spring.mvc.problemdetails.enabled=true
